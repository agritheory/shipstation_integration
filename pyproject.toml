[tool.poetry]
name = "shipstation-integration"
version = "0.1.0"
description = "Shipstation integration for ERPNext"
authors = ["AgriTheory <support@agritheory.dev>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = " >=3.10,<3.13"
shipstation-client = { git = "https://github.com/agritheory/shipstation-client.git", rev = "master" }
test-utils = { git = "https://github.com/agritheory/test_utils.git", rev = "main" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--cov=shipstation_integration --cov-report term-missing"

[tool.coverage.report]
skip_covered = true
skip_empty = true
omit = ["*/config/*", "*/patches/*", "*/tests/*", "*/test_*.py"]
# https://coverage.readthedocs.io/en/latest/excluding.html#advanced-exclusion
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.black]
line-length = 99

[tool.isort]
line_length = 99
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
indent = "\t"
