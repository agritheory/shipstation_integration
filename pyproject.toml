[project]
name = "shipstation_integration"
version = "16.0.0"
description = "Shipstation integration for ERPNext"
requires-python = ">=3.14,<3.15"
readme = "README.md"
dependencies = [ "setuptools<81", "shipstation-client @ git+https://github.com/AgriTheory/shipstation-client.git@master#egg=shipstation-client", "shipengine>=1.0.0",]
[[project.authors]]
name = "AgriTheory"
email = "support@agritheory.dev"

[build-system]
requires = [ "flit_core>=3.2,<4",]
build-backend = "flit_core.buildapi"

[tool.codespell]
skip = "CHANGELOG.md"
ignore-words-list = "ND"

[tool.semantic_release]
version_toml = [ "pyproject.toml:project.version",]
version_variables = [ "shipstation_integration/__init__.py:__version__",]
build_command = "echo 1"

[tool.black]
line-length = 99

[tool.isort]
line_length = 99
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
indent = "\t"

[tool.mypy]
python_version = "3.14"
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
disable_error_code = [ "arg-type", "assignment", "attr-defined", "call-arg", "misc", "no-redef", "operator", "return", "return-value", "union-attr", "var-annotated",]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"
erpnext = ">=16.0.0-dev,<17.0.0"

[tool.bench.dev-dependencies]
pytest = "~=8.3.2"
pytest-cov = "~=5.0.0"
pytest-order = "~=1.2.1"
mypy = "~=1.15.0"
types-requests = "~=2.32.0"

[tool.semantic_release.branches.version]
match = "version-(15|16)"
